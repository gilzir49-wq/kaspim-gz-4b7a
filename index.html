<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כספים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>כספים אישיים — גל</title>
<style>
  :root{
    --bg:#0e1012; --card:#191c20; --card2:#20242a; --line:#2b3038;
    --gold:#F1C93B; --green:#3ea653; --blue:#6ab0f3; --purple:#c98bf3;
    --red:#ef5f5f; --txt:#eef1f4; --muted:#9aa4b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 46px}

  #lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
  #lock .logo{font-size:44px}
  #lock h1{margin:0;font-size:21px;font-weight:800}
  #lock p{margin:0;color:var(--muted);font-size:14px;text-align:center}
  #pin{width:200px;font-size:26px;letter-spacing:8px;text-align:center;padding:14px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);color:var(--txt);outline:none}
  #pin:focus{border-color:var(--gold)}
  #unlock{background:var(--gold);color:#1a1200;border:none;font-weight:800;font-size:17px;padding:13px 34px;border-radius:14px;cursor:pointer}
  #err{color:var(--red);font-size:14px;min-height:18px}

  #app{display:none}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  header .t{font-size:20px;font-weight:800}
  header .u{font-size:12px;color:var(--muted)}
  header button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}

  .tabs{display:flex;gap:8px;margin-bottom:13px}
  .tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}
  .card h2{margin:0 0 11px;font-size:14px;color:var(--muted);font-weight:700}

  .hero{background:linear-gradient(160deg,#20242a,#15181c);border-color:#2f3540}
  .hero .row{display:flex;gap:10px}
  .hero .stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .hero .stat .k{font-size:12px;color:var(--muted)}
  .hero .stat .v{font-size:19px;font-weight:800;margin-top:3px}
  .gapbig{text-align:center;margin:14px 0 4px}
  .gapbig .lbl{font-size:13px;color:var(--muted)}
  .gapbig .num{font-size:40px;font-weight:900;line-height:1.05;margin-top:2px}
  .neg{color:var(--red)} .pos{color:var(--green)}
  .hero .foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}

  .li{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .li .n{font-size:14.5px}
  .li .note{font-size:11.5px;color:var(--muted);margin-top:2px}
  .li .a{font-weight:800;font-size:15px;white-space:nowrap}
  .total{display:flex;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-weight:800}
  .total .a{color:var(--gold);font-size:17px}

  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-inline-start:6px}
  .pill.k{background:rgba(201,139,243,.16);color:var(--purple)}

  /* דפדוף חודשים */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .nav button{background:var(--card);border:1px solid var(--line);color:var(--txt);width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer}
  .nav button:disabled{opacity:.3}
  .nav .lbl{font-size:17px;font-weight:800;text-align:center;flex:1}
  .nav .lbl small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}

  .catrow{margin:9px 0}
  .catrow .top{display:flex;justify-content:space-between;font-size:13.5px}
  .catrow .bar{height:9px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:5px}
  .catrow .bar>span{display:block;height:100%}

  .exp{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .exp:last-child{border-bottom:none}
  .exp .d{font-size:12px;color:var(--muted);min-width:42px}
  .exp .v{font-size:13.5px;flex:1;padding:0 8px}
  .exp .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .exp .a{font-weight:700;font-size:14px;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}

  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>

<div id="lock">
  <div class="logo">🔐</div>
  <h1>כספים אישיים — גל</h1>
  <p>המידע מוצפן. הזן קוד כדי לפתוח.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
  <button id="unlock">כניסה</button>
  <div id="err"></div>
</div>

<div id="app"><div class="wrap">
  <header>
    <div><div class="t">כספים אישיים</div><div class="u" id="upd"></div></div>
    <button onclick="lock()">🔒 נעילה</button>
  </header>
  <div class="tabs">
    <button id="tabOver" class="on" onclick="showTab('over')">סקירה</button>
    <button id="tabMonth" onclick="showTab('month')">לפי חודש</button>
  </div>
  <div id="viewOver"></div>
  <div id="viewMonth" style="display:none"></div>
  <div class="foot">כל מספר מהנתונים בפועל · חד-פעמי ≠ קבוע · המידע מוצפן ומעודכן ידנית.<br>עדכן בצ'אט → הדשבורד מתעדכן.</div>
</div></div>

<script>

const nis = (n,d=0) => "₪" + Number(n).toLocaleString('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d});
const CATCOLORS = {"מזון וסופר":"#3ea653","קפה ואוכל בחוץ":"#F1C93B","בילוי ופנאי":"#6ab0f3","ילדים":"#c98bf3"};
const catColor = c => CATCOLORS[c] || "#8a94a0";
let D=null, mi=0;

async function decrypt(pin){
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, km,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

const sum = a => a.reduce((s,x)=>s+(x.amount!==undefined?x.amount:x.a),0);

function renderOverview(){
  const fixedT=sum(D.fixed), kidsT=sum(D.kidsFixed), varT=sum(D.variable);
  const committed=fixedT+kidsT, gap=D.income-committed, fullNeed=committed+varT, fullGap=D.income-fullNeed;
  const item = x => `<div class="li"><div><div class="n">${x.name}</div>${x.note?`<div class="note">${x.note}</div>`:''}</div><div class="a">${nis(x.amount)}</div></div>`;
  const openHtml = D.openItems.map(o=>`<div class="li"><div><div class="n">${o.label}</div><div class="note">${o.status}</div></div>
      <div class="a ${o.kind==='owe'?'neg':'pos'}">${o.kind==='owe'?'−':'+'}${nis(o.amount,2)}</div></div>`).join('');
  $('#viewOver').innerHTML = `
    <div class="card hero">
      <div class="row">
        <div class="stat"><div class="k">הכנסה קבועה</div><div class="v pos">${nis(D.income)}</div></div>
        <div class="stat"><div class="k">קבועים + ילדים</div><div class="v">${nis(committed)}</div></div>
      </div>
      <div class="gapbig"><div class="lbl">פער חודשי (לפני מזון/דלק משתנים)</div>
        <div class="num ${gap<0?'neg':'pos'}">${gap<0?'−':''}${nis(Math.abs(gap))}</div></div>
      <div class="foot">עם צריכה משתנה (~${nis(varT)}) הצריכה החודשית ≈ <b>${nis(fullNeed)}</b> → פער ≈ <b class="neg">−${nis(Math.abs(fullGap))}</b></div>
    </div>
    <div class="card"><h2>קבועים חודשיים</h2>${D.fixed.map(item).join('')}
      <div class="total"><span>סה"כ קבועים</span><span class="a">${nis(fixedT)}</span></div></div>
    <div class="card"><h2>ילדים</h2>${D.kidsFixed.map(item).join('')}</div>
    <div class="card"><h2>כספים פתוחים</h2>${openHtml}</div>`;
}

function renderMonth(){
  const m = D.months[mi];
  const exp = m.expenses||[], kids = m.kids||[];
  const pT = exp.reduce((s,x)=>s+x.a,0), kT = kids.reduce((s,x)=>s+x.a,0);
  // אגרגציה לקטגוריות
  const cats={}; exp.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.a);
  const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]); const maxc=Math.max(...catArr.map(c=>c[1]),1);
  const catHtml = catArr.map(([c,v])=>`<div class="catrow"><div class="top"><span><span class="dot" style="background:${catColor(c)}"></span>${c}</span><b>${nis(v,2)}</b></div>
      <div class="bar"><span style="width:${Math.max(4,v/maxc*100)}%;background:${catColor(c)}"></span></div></div>`).join('');
  const expHtml = exp.map(x=>`<div class="exp"><div class="d">${x.d}</div>
      <div class="v">${x.v}<div class="meta"><span class="dot" style="background:${catColor(x.cat)}"></span>${x.cat}${x.pay&&x.pay!=='—'?' · '+x.pay:''}</div></div>
      <div class="a">${nis(x.a,2)}</div></div>`).join('');
  const kidsHtml = kids.length ? `<div class="card"><h2>ילדים (${m.label})</h2>${kids.map(x=>`<div class="exp"><div class="d">${x.d}</div>
      <div class="v">${x.v}<div class="meta"><span class="dot" style="background:${catColor('ילדים')}"></span>${x.cat}${x.pay?' · '+x.pay:''}</div></div>
      <div class="a">${nis(x.a,2)}</div></div>`).join('')}<div class="total"><span>סה"כ ילדים</span><span class="a">${nis(kT,2)}</span></div></div>` : '';
  $('#viewMonth').innerHTML = `
    <div class="nav">
      <button id="mprev" ${mi<=0?'disabled':''} onclick="stepMonth(-1)">›</button>
      <div class="lbl">${m.label}<small>${exp.length} קבלות · אישי</small></div>
      <button id="mnext" ${mi>=D.months.length-1?'disabled':''} onclick="stepMonth(1)">‹</button>
    </div>
    <div class="card hero"><div class="gapbig"><div class="lbl">סה"כ הוצאות אישיות בחודש</div>
      <div class="num">${nis(pT,2)}</div></div>${kT?`<div class="foot">+ ילדים ${nis(kT,2)} (בנפרד)</div>`:''}</div>
    <div class="card"><h2>לפי קטגוריה</h2>${catHtml||'<div class="foot">אין הוצאות עדיין</div>'}</div>
    <div class="card"><h2>כל הקבלות</h2>${expHtml||'<div class="foot">אין קבלות עדיין</div>'}</div>
    ${kidsHtml}`;
}

function stepMonth(dir){ mi=Math.min(D.months.length-1,Math.max(0,mi+dir)); renderMonth(); }
function showTab(t){
  const over=t==='over';
  $('#viewOver').style.display=over?'block':'none';
  $('#viewMonth').style.display=over?'none':'block';
  $('#tabOver').classList.toggle('on',over); $('#tabMonth').classList.toggle('on',!over);
  if(!over) renderMonth();
}

function boot(){
  $('#upd').textContent = 'עודכן ' + D.updated;
  mi = D.months.length-1;           // ברירת מחדל: החודש הנוכחי
  renderOverview(); renderMonth();
}

function lock(){ sessionStorage.removeItem('k'); $('#app').style.display='none'; $('#lock').style.display='flex'; $('#pin').value=''; $('#pin').focus(); }
async function tryPin(pin){
  try{ D=await decrypt(pin); sessionStorage.setItem('k',pin);
    $('#lock').style.display='none'; $('#app').style.display='block'; boot(); return true;
  }catch(e){ return false; }
}
$('#unlock').onclick = async ()=>{ $('#err').textContent=''; if(!await tryPin($('#pin').value.trim())) $('#err').textContent='קוד שגוי'; };
$('#pin').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#unlock').click(); });
(async ()=>{ const k=sessionStorage.getItem('k'); if(k){ if(!await tryPin(k)) $('#pin').focus(); } else $('#pin').focus(); })();
</script>
</body>
</html>
